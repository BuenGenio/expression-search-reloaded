name: Bug report
description: Something does not work as described in the help page
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please do **not** report security problems here; see SECURITY.md.
        This tracker is for *Expression Search Reloaded*. Problems with *Expression Search NG* (by opto, on
        addons.thunderbird.net) belong at https://github.com/opto/Expression-Search-NG/issues.
  - type: input
    id: thunderbird
    attributes:
      label: Thunderbird version
      description: Help › About Thunderbird
      placeholder: "157.0.1"
    validations:
      required: true
  - type: input
    id: addon
    attributes:
      label: Add-on version
      placeholder: "5.0.0"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Windows 11 / macOS 15 / Ubuntu 26.04"
  - type: textarea
    id: steps
    attributes:
      label: What did you do?
      description: The exact expression you typed, the keys you pressed, the kind of folder (local, IMAP offline or online, saved search).
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: console
    attributes:
      label: Error Console output
      description: Tools › Developer Tools › Error Console (Ctrl+Shift+J). Enable "Log searches" in the add-on options for more detail. Remove anything private.
      render: text
