name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm test
      - name: Tag must match the manifest version
        run: |
          version=$(node -p 'require("./src/manifest.json").version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest version $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - run: npm run build
      - name: Release notes from CHANGELOG.md
        run: node scripts/changelog-section.mjs "$VERSION" > "$RUNNER_TEMP/notes.md"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.xpi \
            --title "Expression Search Reloaded $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md"
